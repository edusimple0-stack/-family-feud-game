ite-space:nowrap}.team .score{grid-column:2;grid-row:1/3;color:var(--gold);font-size:clamp(25px,3vw,38px);font-weight:900}.controls{border:1px solid var(--border);background:#0e1b32;border-radius:15px;padding:10px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px}.controls button{border:1px solid #6580a9;background:#25446f;color:white;border-radius:10px;min-height:43px;padding:8px 13px;font-weight:800}.controls .wrong{background:#a92e44}.controls .primary{color:#101a30;background:linear-gradient(110deg,#ffdf91,#c78e36)}.controls .good{background:#146e58}.controls .muted{background:#26354d}.hint{font-size:12px;color:#b6c4dc}.overlay{position:fixed;inset:0;display:grid;place-items:center;background:#040a17c9;z-index:20;padding:18px}.dialog{width:min(580px,100%);background:#152947;border:2px solid #e3b85d;border-radius:23px;padding:25px;text-align:center;box-shadow:0 20px 90px #000b}.dialog h2{color:var(--gold);font-size:clamp(23px,4vw,36px)}.dialog p{line-height:1.8}.dialog button{border:0;border-radius:12px;padding:13px 24px;font-weight:900;font-size:17px}.flash{position:fixed;inset:0;z-index:15;display:grid;place-items:center;pointer-events:none;color:#ff4e64;font-size:clamp(120px,25vw,280px);font-weight:900;text-shadow:0 0 60px #e11;animation:fade .9s forwards}@keyframes fade{0%{opacity:0;transform:scale(.7)}25%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.25)}}.footer-note{font-size:11px;color:#99accb;text-align:center}.settings{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center}.settings input[type=range]{width:110px}

/* V10 — palette derived from the competition poster: violet, rose, sky, gold and mint. */
:root{--gold:#ffda7a;--border:#715b9b;color:#fff6fd;background:#21162f}
body{font-family:Tahoma,Arial,sans-serif;background:radial-gradient(ellipse at 52% -25%,#774b9c 0%,#3e285c 39%,#24172f 78%,#1a1227 100%);color:#fff7fc}

.panel{background:linear-gradient(130deg,var(--world-panel),var(--world-panel2));border-color:var(--world-outline)}
.category,.stat strong{color:var(--world-accent)}.clock{border-color:var(--world-accent);color:var(--world-accent);background:radial-gradient(circle,var(--world-panel),var(--world-panel2))}

.answer.revealed{background:linear-gradient(110deg,#fff8ec,var(--world-reveal));color:var(--world-ink);border-color:#fff4e5}.answer.revealed b{background:var(--world-ink);color:#fff6db}

<div id="worldSplash" class="world-splash hide" role="status" aria-live="polite"><div class="world-splash-inner"><div class="symbol" id="worldSymbol">✨</div><div class="world-kicker" id="worldNumber">القسم الأول</div><h2 id="worldTitle"></h2><p id="worldSubtitle"></p><div class="progress-track"><div></div></div></div></div><section id="game" class="game shell hide"><header class="top"><div class="panel"><div class="brand">مسابقات ثقافية <span id="progress"></span></div><div class="category" id="category"></div></div><div class="panel stat"><small>بنك الجولة</small><strong id="pot">0</strong><small id="xs">✕ ✕ ✕</small></div><div id="clock" class="clock">20</div></header><div class="phase" aria-live="polite"><strong id="phaseName">المواجهة الافتتاحية</strong><span id="status"></span></div><main class="main"><div class="question"><h2 id="question"></h2></div><div id="answers" class="answers"></div></main><div id="teams" class="teams"></div><div class="controls"><span class="hint" id="controlHint">لوحة المقدّم: حددي الإجابة أو سجّلي خطأ</span><button class="wrong" id="wrongBtn" onclick="wrong()">✕ إجابة خاطئة</button><button id="passBtn" onclick="passPlay()" class="muted hide">تمرير اللعب للفريق الآخر</button><button id="playBtn" onclick="choosePlay()" class="good hide">▶ نلعب</button><button id="pauseBtn" onclick="pauseToggle()">⏸ إيقاف المؤقت</button><button id="nextBtn" class="primary hide" onclick="nextQuestion()">السؤال التالي ←</button><button onclick="showAll()" id="allBtn" class="muted">كشف المتبقي</button><button onclick="resetRound()" class="muted">↺ إعادة الجولة</button></div></section><div id="overlay" class="overlay hide" role="dialog" aria-modal="true"><div class="dialog"><h2 id="dialogTitle"></h2><p id="dialogText"></p><button class="primary" id="dialogBtn" onclick="closeDialog()">متابعة</button></div></div><script>

let teams=[],sec=0,qi=0,phase='faceoff',faceTeam=0,faceAnswers=[null,null],controller=null,active=0,pot=0,strikes=0,revealed=[false,false,false,false],timerMax=20,left=20,interval=null,token=0,paused=false,ended=false,roundStarter=0,dialogAction=null,audio=null;
const $=id=>document.getElementById(id);const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function renderPlayerInputs(){for(let t=0;t<2;t++){const el=$('p'+t),old=[...el.querySelectorAll('input')].map(x=>x.value);el.innerHTML='';for(let i=0;i<+$('count').value;i++){const x=document.createElement('input');x.placeholder='اسم اللاعب '+(i+1);x.maxLength=35;x.value=old[i]||'';el.append(x)}}}renderPlayerInputs();
function ctx(){
 if(!$('sound').checked)return null;
 try{
  const Engine=window.AudioContext||window.webkitAudioContext;
  if(!Engine)return null;
  if(!audio)audio=new Engine();
  if(audio.state==='suspended')audio.resume().catch(()=>{});
  return audio;
 }catch(e){console.warn('Audio unavailable',e);return null}
}
async function unlockAudio(){
 $('sound').checked=true;
 const a=ctx(),status=$('audioStatus');
 if(!a){status.textContent='الصوت غير مدعوم في هذا المتصفح';return}
 try{
  await a.resume();
  const o=a.createOscillator(),g=a.createGain();
  o.type='sine';o.frequency.value=660;g.gain.value=.001;
  o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.02);
  status.textContent=a.state==='running'?'✓ الصوت مفعّل — جرّبي الأصوات الآن':'الصوت معلّق، اضغطي تفعيل الصوت مجددًا';
  if(a.state==='running')setTimeout(soundCorrect,70);
 }catch(e){status.textContent='تعذّر تشغيل الصوت، جرّبي Safari وأوقفي الوضع الصامت'}
}
document.addEventListener('pointerdown',()=>{if(audio&&audio.state==='suspended')audio.resume().catch(()=>{})},{passive:true});
function tone(f,d=.13,type='sine',v=.24,delay=0,end){const a=ctx();if(!a)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+delay;o.type=type;o.frequency.setValueAtTime(f,t);if(end)o.frequency.exponentialRampToValueAtTime(end,t+d);const vol=Math.max(.0001,v*(+$('volume').value/100));g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.setValueAtTime(vol,t+Math.max(.012,d-.045));g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02)}
function soundWrong(){tone(170,.48,'sawtooth',.65,0,105);tone(164,.46,'square',.24,.012,95);tone(90,.3,'triangle',.27,.08,68)}function soundCorrect(){tone(520,.12);tone(660,.13,'sine',.28,.1);tone(790,.22,'sine',.28,.2)}function soundMove(){tone(490,.09,'triangle');tone(690,.12,'triangle',.3,.08)}function soundEnd(){tone(730,.19,'triangle',.35);tone(560,.19,'triangle',.35,.22);tone(390,.4,'sawtooth',.32,.44)}function soundWin(){[523,659,784,1047].forEach((f,i)=>tone(f,.26,'triangle',.34,i*.13))}function soundSteal(){tone(220,.2,'sawtooth',.3);tone(330,.23,'triangle',.35,.16);tone(440,.28,'sawtooth',.34,.35);tone(660,.4,'triangle',.4,.55)}function soundPopup(){tone(440,.09,'triangle',.26);tone(620,.16,'sine',.32,.09)}function soundTick(){tone(1050,.055,'square',.20)}function soundCountdown(){tone(880,.09,'triangle',.32);tone(620,.10,'triangle',.29,.08)}
function current(){return gameData[sec].questions[qi]}function name(i){return teams[i].name}function player(i){return teams[i].players[teams[i].idx]}

const worlds=[
 {key:'religion',icon:'☪️',title:'نور المعرفة',subtitle:'المسابقات الدينية — اختبروا معلوماتكم!',notes:[392,493,587]},
 {key:'science',icon:'🔬',title:'عالم الاكتشافات',subtitle:'المسابقات العلمية — استعدوا لتحدي العقول!',notes:[440,554,740]},
 {key:'culture',icon:'📚',title:'رحلة عبر الحضارات',subtitle:'المسابقات الثقافية — من يملك الإجابة؟',notes:[349,440,523]},
 {key:'art',icon:'🎨',title:'ألوان الإبداع',subtitle:'المسابقات الفنية — أطلقوا خيالكم!',notes:[523,659,880]}
];
let splashToken=0;
function applyWorld(){document.body.dataset.world=worlds[Math.min(sec,3)].key;}
function soundWorld(){const w=worlds[Math.min(sec,3)];w.notes.forEach((f,i)=>tone(f,.24,'triangle',.34,i*.19));tone(w.notes[2]*2,.48,'sine',.21,.62)}
function enterWorld(){
 applyWorld();const w=worlds[sec],id=++splashToken;
 $('worldSymbol').textContent=w.icon;$('worldNumber').textContent=`القسم ${sec+1} من 4`;
 $('worldTitle').textContent=w.title;$('worldSubtitle').textContent=w.subtitle;
 const splash=$('worldSplash');splash.classList.remove('hide');
 soundWorld();setTimeout(()=>{if(id!==splashToken)return;splash.classList.add('hide');loadRound()},2800);
}

function startGame(){ctx();if(audio&&audio.state==='suspended')audio.resume().catch(()=>{});soundPopup();timerMax=+$('seconds').value;teams=[0,1].map(i=>({name:$('t'+i).value.trim()||'الفريق '+(i+1),players:[...$('p'+i).querySelectorAll('input')].map((x,j)=>x.value.trim()||'اللاعب '+(j+1)),idx:0,score:0}));$('setup').classList.add('hide');$('game').classList.remove('hide');enterWorld()}
function clearClock(){clearInterval(interval);interval=null;token++}function timerReset(){clearClock();left=timerMax;paused=false;$('pauseBtn').textContent='⏸ إيقاف المؤقت';drawClock()}
function drawClock(){$('clock').textContent=left;$('clock').classList.toggle('danger',left<=5)}
function startClock(delay=300){clearClock();left=timerMax;paused=false;drawClock();const id=token;setTimeout(()=>{if(token!==id||ended||phase==='choice'||phase==='done'||!$('overlay').classList.contains('hide'))return;interval=setInterval(()=>{left--;if(left<=10&&left>5)soundTick();if(left<=5&&left>0)soundCountdown();drawClock();if(left<=0){clearClock();soundEnd();wrong(true)}},1000)},delay)}
function pauseToggle(){if(ended||phase==='choice'||phase==='done')return;if(interval){clearInterval(interval);interval=null;paused=true;$('pauseBtn').textContent='▶ استئناف'}else{paused=false;$('pauseBtn').textContent='⏸ إيقاف المؤقت';const id=++token;interval=setInterval(()=>{if(id!==token)return;left--;if(left<=10&&left>5)soundTick();if(left<=5&&left>0)soundCountdown();drawClock();if(left<=0){clearClock();soundEnd();wrong(true)}},1000)}}
function loadRound(){applyWorld();soundMove();timerReset();phase='faceoff';faceTeam=roundStarter;faceAnswers=[null,null];controller=null;active=faceTeam;pot=0;strikes=0;revealed=[false,false,false,false];ended=false;render();startClock(700)}
function render(){const q=current();$('progress').textContent=` · القسم ${sec+1}/4 · السؤال ${qi+1}/6`;$('category').textContent=worlds[sec].icon+' '+gameData[sec].category;$('question').textContent=q.q;$('pot').textContent=pot;$('xs').textContent=[0,1,2].map(i=>i<strikes?'❌':'✕').join(' ');$('phaseName').textContent=({faceoff:'⚡ المواجهة الافتتاحية',choice:'🏁 اختيار السيطرة',play:'🎯 دور الفريق المسيطر',steal:'🔥 فرصة السرقة',done:'🏆 انتهت الجولة'})[phase];$('status').textContent=phase==='faceoff'?`${name(faceTeam)} — ${player(faceTeam)} يجيب في المواجهة`:phase==='choice'?`${name(controller)} حصل على أولوية اللعب`:phase==='play'?`${name(controller)} — دور ${player(active)}`:phase==='steal'?`${name(active)} — إجابة واحدة للسرقة`: 'اكتملت الجولة';$('answers').innerHTML=q.a.map((a,i)=>`<button class="answer ${revealed[i]?'revealed':''}" onclick="reveal(${i})" ${ended?'disabled':''}>${revealed[i]?`<span>${safe(a.t)}</span><b>${a.p}</b>`:i+1}</button>`).join('');$('teams').innerHTML=teams.map((t,i)=>`<div class="team ${active===i&&!ended?'active':''}"><div><h3>${safe(t.name)}</h3><div class="player">${safe(player(i))}${active===i&&!ended?' · الدور الآن':''}</div></div><div class="score">${t.score}</div></div>`).join('');$('wrongBtn').classList.toggle('hide',phase==='choice'||phase==='done');$('passBtn').classList.toggle('hide',phase!=='choice');$('playBtn').classList.toggle('hide',phase!=='choice');$('nextBtn').classList.toggle('hide',phase!=='done');$('allBtn').disabled=false;$('controlHint').textContent=phase==='faceoff'?'لوحة المقدّم: سجّلي نتيجة المواجهة':phase==='steal'?'لوحة المقدّم: سجّلي محاولة السرقة':phase==='choice'?'لوحة المقدّم: سجّلي قرار الفريق':phase==='done'?'لوحة المقدّم: الجولة مكتملة':'لوحة المقدّم: حددي الإجابة أو الخطأ';drawClock()}
function reveal(i){if(ended||phase==='choice'||revealed[i])return;clearClock();revealed[i]=true;pot+=current().a[i].p;soundCorrect();if(phase==='faceoff'){faceAnswers[faceTeam]=i;if(i===0){controller=faceTeam;active=controller;phase='choice';render();dialog('✨ القرار لكم!',`${name(controller)}، الإجابة الأولى لكم! هل تلعبون أم تمرّرون الدور؟`,null)}else resolveFaceoff()}else if(phase==='steal'){finishRound(active,'نجحت السرقة!')}else if(phase==='play'){if(revealed.every(Boolean)){finishRound(controller,'كُشفت جميع الإجابات')}else{rotate(controller);render();startClock(850)}}render()}
function wrong(fromTimer=false){if(ended||phase==='choice')return;clearClock();if(!fromTimer)soundWrong();flashX();if(phase==='faceoff'){faceAnswers[faceTeam]=-1;resolveFaceoff()}else if(phase==='steal'){finishRound(controller,'فشلت السرقة، النقاط للفريق المسيطر')}else if(phase==='play'){strikes++;if(strikes>=3){phase='steal';active=1-controller;render();dialog('🔥 فرصة السرقة!',`${name(active)}، أمامكم فرصة واحدة! إجابة صحيحة متبقية تمنحكم ${pot} نقطة. هل أنتم مستعدون؟`,()=>startClock(450))}else{rotate(controller);render();startClock(1000)}}render()}
function flashX(){const d=document.createElement('div');d.className='flash';d.textContent='✕';document.body.append(d);setTimeout(()=>d.remove(),950)}
function resolveFaceoff(){const other=1-faceTeam;if(faceAnswers[other]===null){faceTeam=other;active=other;render();startClock(950);return}const a=faceAnswers[0],b=faceAnswers[1];if(a===-1&&b===-1){faceAnswers=[null,null];faceTeam=roundStarter;active=faceTeam;render();dialog('⚡ مواجهة جديدة!','لم تُكشف إجابة صحيحة بعد. استعدوا لمواجهة جديدة!',()=>startClock(450));return}if(a>=0&&b>=0&&a===b){faceAnswers=[null,null];faceTeam=roundStarter;active=faceTeam;render();dialog('⚡ مواجهة جديدة!','الفرصة ما زالت أمام الفريقين! استعدوا للمواجهة.',()=>startClock(450));return}controller=a===-1?1:b===-1?0:a<b?0:1;active=controller;phase='choice';render();dialog('✨ القرار لكم!',`${name(controller)}، أنتم أصحاب الإجابة الأعلى! هل تلعبون أم تمرّرون الدور؟`,null)}
function choosePlay(){if(phase!=='choice')return;phase='play';active=controller;strikes=0;rotate(controller);soundMove();render();startClock(500)}function passPlay(){if(phase!=='choice')return;controller=1-controller;choosePlay()}
function rotate(i){teams[i].idx=(teams[i].idx+1)%teams[i].players.length}
function finishRound(winner,reason){clearClock();ended=true;phase='done';teams[winner].score+=pot;soundWin();render();dialog('🏆 '+reason,`${name(winner)} يحصل على ${pot} نقطة من بنك الجولة.`,null)}
function showAll(){if(phase!=='done'){dialog('⏳ انتظروا النتيجة!','ستظهر بقية الإجابات بعد نهاية الجولة.',null);return}revealed=[true,true,true,true];render()}
function nextQuestion(){if(phase!=='done')return;qi++;if(qi>=6){qi=0;sec++}if(sec>=4){showFinal();return}roundStarter=1-roundStarter;if(qi===0)enterWorld();else{loadRound();soundMove()}}
function showFinal(){clearClock();$('phaseName').textContent='🏆 النتيجة النهائية';$('question').textContent=teams[0].score===teams[1].score?'تعادل الفريقان!':'الفائز: '+name(teams[0].score>teams[1].score?0:1);$('status').textContent='انتهت الأسئلة الأربعة والعشرون';$('answers').innerHTML='';$('controls');$('nextBtn').disabled=true;dialog('🎉 انتهت المسابقة',`${name(0)}: ${teams[0].score} نقطة — ${name(1)}: ${teams[1].score} نقطة`,null)}
function resetRound(){dialog('🔁 جولة جديدة!','استعدوا لإعادة هذه الجولة!',()=>loadRound())}
function dialog(title,msg,action){clearClock();if(title.includes('السرقة'))soundSteal();else soundPopup();$('dialogTitle').textContent=title;$('dialogText').textContent=msg;dialogAction=action;$('overlay').classList.remove('hide')}
function closeDialog(){$('overlay').classList.add('hide');const f=dialogAction;dialogAction=null;if(f)f()}
