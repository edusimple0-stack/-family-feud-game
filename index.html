<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مسابقة التحدي الثقافي | V5 للآيباد</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e1b4b;
            --accent-gold: #fbbf24;
            --accent-glow: #f59e0b;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: radial-gradient(circle at center, #312e81 0%, #0f172a 100%);
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }

        /* V4 refinement */
        button,select,input { touch-action: manipulation; }
        button:focus-visible,select:focus-visible,input:focus-visible {outline:3px solid #fbbf24;outline-offset:3px}
        .glass-panel {background:linear-gradient(140deg,rgba(49,46,129,.85),rgba(15,23,42,.94));box-shadow:0 18px 50px rgba(0,0,0,.25)}
        .team-player {color:#c7d2fe;font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        @media(max-width:850px){#gameScreen{height:auto;min-height:100vh}#uiScoreboard{position:relative;bottom:auto;flex-wrap:wrap;padding-bottom:8px}#hostControls{position:relative}#gameMain{padding-bottom:20px}header{flex-wrap:wrap;gap:12px}}
        @media(prefers-reduced-motion:reduce){.show-strike,.timer-warning{animation:none}.card-inner{transition:none}}
        /* Animations & Glows */
        .text-glow { text-shadow: 0 0 10px rgba(251, 191, 36, 0.8), 0 0 20px rgba(251, 191, 36, 0.4); }
        .box-glow { box-shadow: 0 0 15px rgba(99, 102, 241, 0.5), inset 0 0 20px rgba(0,0,0,0.5); }
        .active-team-glow { box-shadow: 0 0 20px rgba(34, 197, 94, 0.8) !important; border-color: #22c55e !important; }

        /* Flip Card Base */
        .card-container { perspective: 1000px; }
        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
        }
        .card-inner.flipped { transform: rotateX(180deg); }
        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid #4f46e5;
        }
        .card-front {
            background: linear-gradient(145deg, #3730a3, #1e1b4b);
            font-size: 3rem;
            font-weight: 900;
            color: var(--accent-gold);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.6);
        }
        .card-back {
            background: linear-gradient(145deg, #fbbf24, #d97706);
            color: #1e1b4b;
            transform: rotateX(180deg);
            padding: 0 1.5rem;
            font-size: 2rem;
            font-weight: 900;
            justify-content: space-between;
        }

        /* Giant Strike Animation */
        @keyframes strikeFlash {
            0% { transform: scale(0.5); opacity: 0; }
            15% { transform: scale(1.2); opacity: 1; }
            30% { transform: scale(1); opacity: 1; }
            80% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.5); opacity: 0; }
        }
        .giant-x {
            position: fixed;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 20rem;
            color: #ef4444;
            text-shadow: 0 0 40px #7f1d1d, 10px 10px 0 #450a0a;
            z-index: 9999;
            pointer-events: none;
            opacity: 0;
            font-weight: 900;
            display: flex;
            gap: 2rem;
        }
        .show-strike { animation: strikeFlash 1.5s ease-out forwards; }

        /* Small Strikes UI */
        .strike-mark { color: #ef4444; text-shadow: 0 0 10px #ef4444; opacity: 0.2; transition: opacity 0.3s; }
        .strike-mark.active { opacity: 1; }

        /* Timer Pulse */
        @keyframes pulse-red {
            0%, 100% { background-color: #ef4444; box-shadow: 0 0 20px #ef4444; }
            50% { background-color: #991b1b; box-shadow: 0 0 5px #991b1b; }
        }
        .timer-warning { animation: pulse-red 1s infinite; color: white !important; }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-primary); }
        ::-webkit-scrollbar-thumb { background: #4f46e5; border-radius: 4px; }

/* V5: balanced, non-overlapping presentation layout */
html,body{margin:0;min-height:100%;}
#gameScreen.flex{display:grid!important;grid-template-rows:auto minmax(0,1fr) auto auto;gap:clamp(6px,1.1vh,14px);height:100dvh;min-height:0;overflow:hidden;padding:clamp(8px,1.3vh,16px);box-sizing:border-box;}
#gameScreen>header{padding:0!important;display:grid!important;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:clamp(8px,1.7vw,24px);min-height:0;}
#gameScreen>header>div:first-child{display:flex;flex-direction:row;align-items:stretch;gap:clamp(8px,1vw,14px);min-width:0;}
#gameScreen>header>div:first-child>div{padding:clamp(6px,1vh,12px) clamp(10px,1.3vw,20px)!important;min-width:0;}
#gameScreen>header>div:first-child>div:first-child{flex:1;}
#uiCategory{font-size:clamp(17px,2.1vw,29px)!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#gameScreen>header .text-lg{font-size:clamp(11px,1.3vw,16px)!important;}
#gameScreen>header #uiPot{font-size:clamp(25px,3vw,42px)!important;}
#uiStrikes{font-size:clamp(25px,3.3vw,46px)!important;gap:clamp(2px,.7vw,10px)!important;}
#uiTimer{width:clamp(60px,8vh,94px)!important;height:clamp(60px,8vh,94px)!important;font-size:clamp(26px,4vh,44px)!important;}
#gameMain{padding:0!important;min-height:0;min-width:0;display:grid!important;grid-template-rows:auto minmax(0,1fr);align-content:stretch;gap:clamp(8px,1.5vh,18px);justify-items:center;}
#gameMain>div:first-child{margin:0!important;padding:clamp(10px,1.8vh,22px)!important;width:100%;max-width:1150px;}
#uiQuestion{font-size:clamp(20px,3.1vw,42px)!important;line-height:1.4!important;}
#uiAnswersGrid{min-height:0;max-width:1100px;grid-template-columns:repeat(2,minmax(0,1fr))!important;grid-template-rows:repeat(2,minmax(0,1fr));gap:clamp(8px,1.4vh,18px)!important;align-self:stretch;}
#uiAnswersGrid .card-container{height:100%!important;min-height:0;}
#uiAnswersGrid .card-front{font-size:clamp(24px,4vh,44px)!important;}
#uiAnswersGrid .card-back{font-size:clamp(14px,2vw,26px)!important;padding:0 clamp(8px,1.2vw,20px)!important;gap:6px;}
#uiAnswersGrid .card-back>div{min-width:48px!important;padding:5px 10px!important;font-size:clamp(17px,2.3vw,30px)!important;}
#uiScoreboard{position:static!important;bottom:auto!important;left:auto!important;right:auto!important;display:grid!important;grid-template-columns:repeat(var(--team-count,2),minmax(0,1fr));gap:clamp(5px,.9vw,12px)!important;padding:0!important;overflow:visible!important;min-width:0;}
#uiScoreboard>div{min-width:0!important;padding:clamp(5px,.9vh,12px)!important;border-radius:12px!important;}
#uiScoreboard>div .text-xl{font-size:clamp(12px,1.4vw,18px)!important;margin:0!important;}
#uiScoreboard>div .text-4xl{font-size:clamp(19px,2.6vw,32px)!important;line-height:1.25;}
#uiScoreboard .team-player{font-size:clamp(10px,1.1vw,13px)!important;}
#hostControls{position:static!important;bottom:auto!important;width:100%;padding:clamp(6px,1vh,12px)!important;border-radius:16px;border:1px solid #6366f1!important;}
#hostControls>div{gap:clamp(4px,.8vh,9px)!important;}
#hostControls>div>div:first-child{gap:clamp(4px,.7vw,9px)!important;}
#hostControls>div>div:nth-child(2){padding:clamp(5px,.7vh,9px)!important;gap:clamp(6px,1vw,15px)!important;}
#hostControls button{min-height:36px;padding:clamp(5px,.8vh,10px) clamp(9px,1.2vw,18px)!important;font-size:clamp(11px,1.25vw,16px)!important;white-space:nowrap;}
#hostControls .text-xs{font-size:clamp(9px,1vw,12px)!important;}
#hostControls .text-center.text-indigo-300.text-xs{display:none;}
#giantStrikeOverlay{font-size:clamp(7rem,19vw,17rem);}
@media (max-height:690px) and (min-width:700px){
 #gameScreen.flex{gap:5px;padding:6px 10px;}
 #gameMain{gap:6px;}
 #gameMain>div:first-child{padding:7px 12px!important;}
 #uiQuestion{font-size:clamp(18px,2.5vw,31px)!important;}
 #uiTimer{width:55px!important;height:55px!important;font-size:27px!important;}
 #hostControls button{min-height:30px;padding:4px 10px!important;}
 #hostControls>div>div:nth-child(2){padding:4px!important;}
}
@media (max-width:699px), (max-height:480px){
 #gameScreen.flex{height:auto;min-height:100dvh;overflow:visible;display:flex!important;flex-direction:column;gap:12px;padding:10px;}
 #gameScreen>header{grid-template-columns:minmax(0,1fr) auto;}
 #uiStrikes{grid-column:1 / -1;grid-row:2;justify-content:center;}
 #gameMain{display:flex!important;flex-direction:column;}
 #uiAnswersGrid{grid-template-columns:repeat(2,minmax(0,1fr))!important;grid-template-rows:repeat(2,100px);}
 #uiScoreboard{grid-template-columns:repeat(2,minmax(0,1fr));}
 #hostControls>div>div:nth-child(2){justify-content:center;}
 #hostControls>div>div:nth-child(2)>div{flex-wrap:wrap;justify-content:center;}
}

    </style>
</head>
<body>

    <!-- ================= SETUP SCREEN ================= -->
    <div id="setupScreen" class="flex-1 flex flex-col items-center justify-center p-6 z-10">
        <div class="glass-panel backdrop-blur-md border-2 border-indigo-500 rounded-3xl p-7 max-w-3xl w-full shadow-2xl text-center box-glow">
            <h1 class="text-5xl md:text-6xl font-black text-yellow-400 mb-4 text-glow">مسابقة التحدي الثقافي</h1>
            <p class="text-indigo-200 mb-8 text-xl">لوحة التحكم الاحترافية التفاعلية</p>

            <div class="mb-6">
                <label class="block text-2xl font-bold mb-4 text-indigo-100">حدد عدد الفرق المتنافسة (2 - 6)</label>
                <select id="teamCountSelect" onchange="generateTeamInputs()" class="w-full bg-indigo-900 border-2 border-indigo-400 rounded-xl p-4 text-2xl font-bold text-center text-yellow-300 focus:outline-none focus:border-yellow-400 transition">
                    <option value="2">2 (فريقان)</option>
                    <option value="3">3 فرق</option>
                    <option value="4">4 فرق</option>
                    <option value="5">5 فرق</option>
                    <option value="6">6 فرق</option>
                </select>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6 text-right">
                <div><label for="playerCountSelect" class="block mb-2 font-bold text-indigo-100">عدد اللاعبين في كل فريق</label>
                    <select id="playerCountSelect" onchange="generateTeamInputs()" class="w-full bg-indigo-900 border-2 border-indigo-400 rounded-xl p-3 text-xl font-bold text-yellow-300">
                        <option value="1">لاعب واحد</option><option value="2">لاعبان</option><option value="3" selected>3 لاعبين</option><option value="4">4 لاعبين</option>
                    </select></div>
                <div><label for="timerSelect" class="block mb-2 font-bold text-indigo-100">وقت اللاعب</label>
                    <select id="timerSelect" class="w-full bg-indigo-900 border-2 border-indigo-400 rounded-xl p-3 text-xl font-bold text-yellow-300">
                        <option value="10">10 ثوانٍ</option><option value="15">15 ثانية</option><option value="20" selected>20 ثانية</option><option value="30">30 ثانية</option><option value="45">45 ثانية</option><option value="60">60 ثانية</option>
                    </select></div>
            </div>
            <div class="flex flex-wrap justify-between items-center gap-3 mb-5 bg-slate-900/60 border border-indigo-500/40 rounded-xl p-3 text-sm">
              <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" id="soundEnabled" checked class="w-5 h-5 accent-yellow-400"> تفعيل المؤثرات الصوتية</label>
              <label class="flex items-center gap-2">مستوى الصوت <input id="soundVolume" type="range" min="0" max="100" value="72" class="accent-yellow-400 w-28"></label>
              <button type="button" onclick="soundStrike()" class="px-4 py-2 bg-indigo-700 rounded-lg hover:bg-indigo-600">🔊 تجربة BZZZ</button>
            </div>
            <div id="teamInputsWrapper" class="space-y-4 mb-8 max-h-[40vh] overflow-y-auto p-2">
                <!-- Team inputs generated dynamically -->
            </div>

            <button onclick="startGame()" class="w-full bg-gradient-to-r from-yellow-500 to-amber-600 hover:from-yellow-400 hover:to-amber-500 text-indigo-950 font-black text-3xl py-5 rounded-2xl shadow-[0_0_20px_rgba(251,191,36,0.5)] transform transition hover:scale-105 active:scale-95 border-2 border-yellow-200">
                🚀 ابدأ التحدي الآن
            </button>
        </div>
    </div>

    <!-- ================= MAIN GAME SCREEN ================= -->
    <div id="gameScreen" class="hidden flex-1 flex-col relative h-screen">
        
        <!-- Header: Category, Timer, Pot -->
        <header class="flex justify-between items-start p-6 relative z-10">
            <!-- Info & Pot -->
            <div class="flex flex-col gap-4">
                <div class="bg-indigo-900/80 border-2 border-indigo-500 py-2 px-6 rounded-2xl shadow-lg">
                    <div class="text-indigo-300 font-bold text-lg">القسم <span id="uiSectionNum" class="text-white">1/4</span> | السؤال <span id="uiQuestionNum" class="text-white">1/6</span></div>
                    <div id="uiCategory" class="text-3xl font-black text-yellow-400 text-glow mt-1">الأسئلة الدينية</div>
                </div>
                <div class="bg-indigo-950/90 border-2 border-green-500 py-3 px-8 rounded-2xl shadow-[0_0_15px_rgba(34,197,94,0.3)] text-center w-fit">
                    <div class="text-green-400 font-bold mb-1">بنك الجولة</div>
                    <div id="uiPot" class="text-5xl font-black text-white">0</div>
                </div>
            </div>

            <!-- Strikes -->
            <div id="uiStrikes" class="flex gap-4 text-6xl" dir="ltr">
                <span id="strike1" class="strike-mark">❌</span>
                <span id="strike2" class="strike-mark">❌</span>
                <span id="strike3" class="strike-mark">❌</span>
            </div>

            <!-- Timer -->
            <div class="flex flex-col items-center">
                <div id="uiTimer" class="w-28 h-28 bg-indigo-900 border-4 border-indigo-400 rounded-full flex items-center justify-center text-5xl font-black text-yellow-400 shadow-lg transition-colors duration-300">
                    20
                </div>
            </div>
        </header>

        <!-- Main Content: Question & Answers -->
        <main id="gameMain" class="flex-1 flex flex-col items-center justify-center px-6 pb-48 z-10">
            <!-- Question -->
            <div class="w-full max-w-6xl mb-10 bg-indigo-950/80 p-8 rounded-3xl border-2 border-indigo-400 box-glow text-center">
                <h2 id="uiQuestion" class="text-4xl md:text-5xl lg:text-6xl font-black text-white leading-tight">
                    <!-- Question Text -->
                </h2>
            </div>

            <!-- Answers Grid -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full max-w-5xl" id="uiAnswersGrid">
                <!-- Cards generated here -->
            </div>
        </main>

        <!-- Scoreboard (Pinned above controls) -->
        <div id="uiScoreboard" class="fixed bottom-[140px] left-0 right-0 px-6 flex justify-center gap-4 overflow-x-auto z-20 pb-4">
            <!-- Teams generated here -->
        </div>

        <!-- ================= HOST CONTROLS (Fixed Bottom) ================= -->
        <div id="hostControls" class="fixed bottom-0 w-full bg-slate-900 border-t-4 border-indigo-500 p-4 z-30 shadow-[0_-10px_30px_rgba(0,0,0,0.8)]">
            <div class="max-w-7xl mx-auto flex flex-col gap-3">
                <!-- Top Row: Card Reveals -->
                <div class="flex justify-center gap-2">
                    <span class="text-indigo-300 font-bold self-center ml-2">كشف الإجابات:</span>
                    <button onclick="hostRevealCard(0)" class="bg-indigo-700 hover:bg-indigo-600 text-white font-bold py-2 px-6 rounded-lg border border-indigo-400">1</button>
                    <button onclick="hostRevealCard(1)" class="bg-indigo-700 hover:bg-indigo-600 text-white font-bold py-2 px-6 rounded-lg border border-indigo-400">2</button>
                    <button onclick="hostRevealCard(2)" class="bg-indigo-700 hover:bg-indigo-600 text-white font-bold py-2 px-6 rounded-lg border border-indigo-400">3</button>
                    <button onclick="hostRevealCard(3)" class="bg-indigo-700 hover:bg-indigo-600 text-white font-bold py-2 px-6 rounded-lg border border-indigo-400">4</button>
                </div>

                <!-- Bottom Row: Main Controls -->
                <div class="flex flex-wrap items-center justify-between gap-4 bg-slate-800 p-3 rounded-xl border border-slate-700">
                    
                    <!-- Timer & Nav -->
                    <div class="flex gap-2 items-center">
                        <button onclick="navPrev()" class="bg-slate-700 hover:bg-slate-600 text-white p-3 rounded-lg border border-slate-500" title="السؤال السابق">⬅️</button>
                        <button onclick="navNext()" class="bg-blue-600 hover:bg-blue-500 text-white font-bold p-3 rounded-lg border border-blue-400" title="السؤال التالي">➡️ التالي</button>
                        <div class="h-8 w-px bg-slate-600 mx-2"></div>
                        <button onclick="toggleTimer()" id="btnTimerToggle" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 px-4 rounded-lg border border-emerald-400">▶️ مؤقت</button>
                        <button onclick="resetTimer()" class="bg-slate-700 hover:bg-slate-600 text-white p-2 rounded-lg border border-slate-500">🔄</button>
                    </div>

                    <!-- Points Controls -->
                    <div class="flex gap-3 items-center">
                        <button onclick="hostStrike()" class="bg-red-600 hover:bg-red-500 text-white font-black text-xl py-2 px-6 rounded-lg border-2 border-red-400 shadow-[0_0_10px_rgba(239,68,68,0.4)]">
                            ❌ خطأ
                        </button>
                        <button onclick="awardOutsideAnswer()" class="bg-purple-600 hover:bg-purple-500 text-white font-bold py-2 px-4 rounded-lg border border-purple-400">
                            +5 خارج اللوحة
                        </button>
                        <div class="flex flex-col items-center bg-slate-900 px-4 py-1 rounded-lg border border-slate-600">
                            <span class="text-xs text-yellow-400 mb-1">منح بنك الجولة للفريق المظلل:</span>
                            <button onclick="awardPot()" class="bg-yellow-600 hover:bg-yellow-500 text-slate-900 font-black py-1 px-8 rounded border border-yellow-400 text-sm">
                                💰 منح البنك وتصفيره
                            </button>
                        </div>
                    </div>

                </div>
                <div class="text-center text-indigo-300 text-xs">💡 انقري على بطاقة الفريق لتغيير الدور · عند الخطأ الثالث ينتقل الدور للفريق التالي تلقائيًا</div>
            </div>
        </div>
    </div>

    <!-- Giant Strike Overlay -->
    <div id="giantStrikeOverlay" class="giant-x"></div>

    <script>
        // ================= GAME DATA =================
        const gameData = [
            {
                category: "الأسئلة الدينية",
                questions: [
                    { q: "سورة تبدأ بالحروف المقطعة؟", a: [{t: "البقرة", p: 40}, {t: "مريم", p: 30}, {t: "طه", p: 20}, {t: "الشورى", p: 10}] },
                    { q: "نبي أُرسل إلى قوم ورد ذكرهم بالقرآن؟", a: [{t: "هود (عاد)", p: 40}, {t: "صالح (ثمود)", p: 30}, {t: "شعيب (مدين)", p: 20}, {t: "لوط (قوم لوط)", p: 10}] },
                    { q: "صحابي اشتهر بلقب معروف؟", a: [{t: "أبو بكر (الصديق)", p: 40}, {t: "عمر (الفاروق)", p: 30}, {t: "خالد بن الوليد", p: 20}, {t: "أبو عبيدة (أمين الأمة)", p: 10}] },
                    { q: "غزوة شارك فيها النبي ﷺ وذُكرت بالقرآن؟", a: [{t: "بدر", p: 40}, {t: "أحد", p: 30}, {t: "الخندق", p: 20}, {t: "حنين", p: 10}] },
                    { q: "سورة سُمّيت باسم ظاهرة أو جرم كوني؟", a: [{t: "الشمس", p: 40}, {t: "القمر", p: 30}, {t: "النجم", p: 20}, {t: "الرعد", p: 10}] },
                    { q: "كتاب من كتب الحديث النبوي المشهورة؟", a: [{t: "صحيح البخاري", p: 40}, {t: "صحيح مسلم", p: 30}, {t: "سنن أبي داود", p: 20}, {t: "سنن النسائي", p: 10}] }
                ]
            },
            {
                category: "الأسئلة العلمية",
                questions: [
                    { q: "عنصر كيميائي يُستخدم في صناعة الإلكترونيات؟", a: [{t: "السيليكون", p: 40}, {t: "النحاس", p: 30}, {t: "الذهب", p: 20}, {t: "الجرمانيوم", p: 10}] },
                    { q: "كوكب في المجموعة الشمسية يمتلك حلقات؟", a: [{t: "زحل", p: 40}, {t: "المشتري", p: 30}, {t: "أورانوس", p: 20}, {t: "نبتون", p: 10}] },
                    { q: "عالم ارتبط اسمه بنظرية أو قانون؟", a: [{t: "نيوتن (الحركة)", p: 40}, {t: "أينشتاين (النسبية)", p: 30}, {t: "مندل (الوراثة)", p: 20}, {t: "كبلر (الكواكب)", p: 10}] },
                    { q: "عضو أو نسيج يشارك في تنظيم حرارة الجسم؟", a: [{t: "الجلد", p: 40}, {t: "الدماغ (تحت المهاد)", p: 30}, {t: "الأوعية الدموية", p: 20}, {t: "الغدد العرقية", p: 10}] },
                    { q: "وحدة قياس تحمل اسم عالم؟", a: [{t: "نيوتن (القوة)", p: 40}, {t: "باسكال (الضغط)", p: 30}, {t: "جول (الطاقة)", p: 20}, {t: "تسلا (المغناطيس)", p: 10}] },
                    { q: "غاز من الغازات الدفيئة المسببة للاحتباس؟", a: [{t: "ثاني أكسيد الكربون", p: 40}, {t: "الميثان", p: 30}, {t: "أكسيد النيتروز", p: 20}, {t: "سداسي فلوريد الكبريت", p: 10}] }
                ]
            },
            {
                category: "الأسئلة الثقافية",
                questions: [
                    { q: "دولة عربية تطل على البحر الأحمر؟", a: [{t: "السعودية", p: 40}, {t: "مصر", p: 30}, {t: "السودان", p: 20}, {t: "الأردن", p: 10}] },
                    { q: "موقع سعودي مسجل في اليونسكو؟", a: [{t: "الحِجر (مدائن صالح)", p: 40}, {t: "حي الطريف بالدرعية", p: 30}, {t: "جدة التاريخية", p: 20}, {t: "الفن الصخري (حائل)", p: 10}] },
                    { q: "مدينة كانت عاصمة لحضارة تاريخية؟", a: [{t: "بغداد (العباسية)", p: 40}, {t: "دمشق (الأموية)", p: 30}, {t: "القسطنطينية (البيزنطية)", p: 20}, {t: "قرطبة (الأندلس)", p: 10}] },
                    { q: "أديب عربي حصل على جائزة عالمية؟", a: [{t: "نجيب محفوظ", p: 40}, {t: "أدونيس", p: 30}, {t: "محمود درويش", p: 20}, {t: "أمين معلوف", p: 10}] },
                    { q: "مضيق بحري مشهور يربط مسطحين مائيين؟", a: [{t: "مضيق هرمز", p: 40}, {t: "مضيق جبل طارق", p: 30}, {t: "باب المندب", p: 20}, {t: "مضيق البوسفور", p: 10}] },
                    { q: "عملة رسمية لدولة من مجموعة العشرين (G20)؟", a: [{t: "الريال السعودي", p: 40}, {t: "الين الياباني", p: 30}, {t: "الوون الكوري", p: 20}, {t: "الروبية الهندية", p: 10}] }
                ]
            },
            {
                category: "الأسئلة الفنية",
                questions: [
                    { q: "مدرسة أو حركة فنية في الفن التشكيلي؟", a: [{t: "الانطباعية", p: 40}, {t: "التكعيبية", p: 30}, {t: "السريالية", p: 20}, {t: "التعبيرية", p: 10}] },
                    { q: "فنان عالمي ارتبط اسمه بعمل شهير؟", a: [{t: "دا فينشي (الموناليزا)", p: 40}, {t: "فان غوخ (النجوم)", p: 30}, {t: "مونك (الصرخة)", p: 20}, {t: "دالي (الذاكرة)", p: 10}] },
                    { q: "مبدأ يُستخدم في تكوين التصميم البصري؟", a: [{t: "التوازن", p: 40}, {t: "التباين", p: 30}, {t: "الإيقاع", p: 20}, {t: "التسلسل الهرمي", p: 10}] },
                    { q: "نوع من اللقطات أو زوايا الكاميرا؟", a: [{t: "اللقطة القريبة", p: 40}, {t: "اللقطة الواسعة", p: 30}, {t: "زاوية عين الطائر", p: 20}, {t: "الزاوية المنخفضة", p: 10}] },
                    { q: "فن تقليدي مرتبط بالتراث السعودي؟", a: [{t: "العرضة السعودية", p: 40}, {t: "القط العسيري", p: 30}, {t: "السدو", p: 20}, {t: "زخرفة الرواشين", p: 10}] },
                    { q: "مخرج سينمائي اشتهر بفيلم معروف؟", a: [{t: "كريستوفر نولان", p: 40}, {t: "ستيفن سبيلبرغ", p: 30}, {t: "جيمس كاميرون", p: 20}, {t: "أكيرا كوروساوا", p: 10}] }
                ]
            }
        ];

        // ================= STATE =================
        let teams = [];
        let activeTeamIndex = 0;
        let currentSectionIdx = 0;
        let currentQuestionIdx = 0;
        let pot = 0;
        let strikes = 0;
        let revealedFlags = [false, false, false, false];
        let timerAmount = 20;
        let currentTimer = 20;
        let timerInterval = null;

        // ================= AUDIO (Web Audio API) =================
                 let audioCtx = null;
         function getAudio() {
             if(!document.getElementById('soundEnabled')?.checked) return null;
             try { audioCtx ||= new (window.AudioContext || window.webkitAudioContext)(); if(audioCtx.state==='suspended') audioCtx.resume(); return audioCtx; }
             catch(e){return null;}
         }
         function audioVolume(){return +(document.getElementById('soundVolume')?.value ?? 72)/100;}
         function playTone(freq,type='sine',duration=.12,volume=.3,delay=0,endFreq=null){
             const ctx=getAudio();if(!ctx)return;
             const t=ctx.currentTime+delay,osc=ctx.createOscillator(),gain=ctx.createGain();
             osc.type=type;osc.frequency.setValueAtTime(freq,t);
             if(endFreq)osc.frequency.exponentialRampToValueAtTime(endFreq,t+duration);
             const level=Math.max(.0001,volume*audioVolume());
             gain.gain.setValueAtTime(.0001,t);gain.gain.linearRampToValueAtTime(level,t+.008);
             gain.gain.setValueAtTime(level,t+Math.max(.01,duration-.045));
             gain.gain.exponentialRampToValueAtTime(.0001,t+duration);
             osc.connect(gain);gain.connect(ctx.destination);osc.start(t);osc.stop(t+duration+.02);
         }
         function soundCorrect(){playTone(523.25,'sine',.15,.36);playTone(659.25,'sine',.16,.36,.11);playTone(783.99,'sine',.26,.36,.23)}
         // A short, recognizable game-show buzzer without prolonged harsh clipping.
         function soundStrike(){playTone(175,'sawtooth',.38,.32,0,142);playTone(178,'square',.34,.12,.02,140)}
         function soundNavigate(){playTone(520,'triangle',.075,.24);playTone(700,'sine',.085,.19,.065)}
         function soundSwitch(){playTone(430,'sine',.085,.23);playTone(590,'triangle',.11,.23,.085)}
         function soundTimerTick(){playTone(860,'sine',.07,.26)}
         function soundTimerEnd(){playTone(650,'square',.20,.24);playTone(510,'square',.20,.24,.24);playTone(370,'sawtooth',.46,.25,.49,290)}

         // Keep sound preferences after navigating away from the setup screen.
         try {const saved=JSON.parse(localStorage.getItem('feudSoundV5')||'null');if(saved){document.getElementById('soundEnabled').checked=saved.enabled;document.getElementById('soundVolume').value=saved.volume;}}catch(e){}
         ['soundEnabled','soundVolume'].forEach(id=>document.getElementById(id)?.addEventListener('change',()=>{try{localStorage.setItem('feudSoundV5',JSON.stringify({enabled:document.getElementById('soundEnabled').checked,volume:document.getElementById('soundVolume').value}));}catch(e){}}));

// ================= SETUP LOGIC =================
                 function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
         let setupNames={};
         function generateTeamInputs() {
             document.querySelectorAll('[data-name-key]').forEach(el=>setupNames[el.dataset.nameKey]=el.value);
             const count=+document.getElementById('teamCountSelect').value;
             const members=+document.getElementById('playerCountSelect').value;
             const container=document.getElementById('teamInputsWrapper');container.innerHTML='';
             for(let i=1;i<=count;i++) {
                 const name=escapeHtml(setupNames['team'+i]??'فريق '+i);
                 let inputs='';
                 for(let j=1;j<=members;j++) inputs+=`<input data-name-key="p${i}_${j}" type="text" maxlength="45" placeholder="اللاعب ${j}" value="${escapeHtml(setupNames['p'+i+'_'+j]??'')}" class="min-w-0 w-full bg-indigo-900/80 border border-indigo-600 rounded-lg p-2 text-white focus:border-yellow-400">`;
                 container.innerHTML+=`<div class="glass-panel text-right p-4 rounded-xl border border-indigo-600"><div class="flex items-center gap-3 mb-3"><span class="bg-yellow-400 text-indigo-950 rounded-lg px-3 py-1 font-black">${i}</span><input data-name-key="team${i}" type="text" maxlength="50" value="${name}" class="w-full min-w-0 bg-indigo-900 border border-indigo-500 rounded-lg p-3 font-bold text-lg"></div><div class="grid grid-cols-1 sm:grid-cols-2 gap-2">${inputs}</div></div>`;
             }
         }
         function startGame() {
             const count=+document.getElementById('teamCountSelect').value;
             const members=+document.getElementById('playerCountSelect').value;
             timerAmount=+document.getElementById('timerSelect').value;
             teams=[];
             for(let i=1;i<=count;i++){
                 const name=document.querySelector(`[data-name-key="team${i}"]`).value.trim()||`فريق ${i}`;
                 const players=[];
                 for(let j=1;j<=members;j++) players.push(document.querySelector(`[data-name-key="p${i}_${j}"]`).value.trim()||`اللاعب ${j}`);
                 teams.push({name,players,playerIndex:0,score:0});
             }
             activeTeamIndex=0;currentSectionIdx=0;currentQuestionIdx=0;
             document.getElementById('setupScreen').classList.add('hidden');
             document.getElementById('gameScreen').classList.remove('hidden');
             document.getElementById('gameScreen').classList.add('flex');
             renderScoreboard();loadQuestion();updateActivePlayerUI();
         }

// ================= GAME LOGIC =================
        function loadQuestion() {
            if (currentSectionIdx >= gameData.length) {
                alert("انتهت جميع الأسئلة! أعد تحميل الصفحة للبدء من جديد.");
                return;
            }

            const sec = gameData[currentSectionIdx];
            const q = sec.questions[currentQuestionIdx];

            // Reset Round State
            pot = 0;
            strikes = 0;
            revealedFlags = [false, false, false, false];
            resetTimer();

            // Update UI
            document.getElementById('uiSectionNum').textContent = `${currentSectionIdx + 1}/4`;
            document.getElementById('uiQuestionNum').textContent = `${currentQuestionIdx + 1}/6`;
            document.getElementById('uiCategory').textContent = sec.category;
            document.getElementById('uiQuestion').textContent = q.q;
            updatePotUI();
            updateStrikesUI();

            // Render Cards
            const grid = document.getElementById('uiAnswersGrid');
            grid.innerHTML = '';
            q.a.forEach((ans, index) => {
                grid.innerHTML += `
                    <div class="h-28 md:h-32 card-container" id="cardWrap${index}">
                        <div class="card-inner cursor-pointer" id="cardInner${index}" onclick="hostRevealCard(${index})">
                            <div class="card-front">
                                <span>${index + 1}</span>
                            </div>
                            <div class="card-back">
                                <span class="text-right flex-1 leading-tight">${ans.t}</span>
                                <div class="bg-indigo-900 text-yellow-400 px-5 py-2 rounded-lg border-2 border-indigo-700 h-full flex items-center justify-center min-w-[70px] ml-2 font-black text-3xl shadow-inner">
                                    ${ans.p}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function hostRevealCard(idx) {
            if(revealedFlags[idx]) return; // already revealed
            const q = gameData[currentSectionIdx].questions[currentQuestionIdx];
            const points = q.a[idx].p;
            
            // Flip
            document.getElementById(`cardInner${idx}`).classList.add('flipped');
            revealedFlags[idx] = true;
            
            // Audio & Pot
            soundCorrect();
            pot += points;
            updatePotUI();
            resetTimer(); // standard show rule, pause/reset on reveal
        }

        function hostStrike() {
            if(strikes >= 3) return;
            strikes++;
            updateStrikesUI();
            soundStrike();
            resetTimer();

            // Show Giant Strike Overlay
            const overlay = document.getElementById('giantStrikeOverlay');
            overlay.innerHTML = Array(strikes).fill('❌').join('');
            overlay.classList.remove('show-strike');
            void overlay.offsetWidth; // trigger reflow
            overlay.classList.add('show-strike');
            if(strikes===3){setTimeout(()=>{setActiveTeam((activeTeamIndex+1)%teams.length);strikes=0;updateStrikesUI();},1150)}
        }

        function updateStrikesUI() {
            for(let i=1; i<=3; i++) {
                const el = document.getElementById(`strike${i}`);
                if(i <= strikes) el.classList.add('active');
                else el.classList.remove('active');
            }
        }

        function updatePotUI() {
            document.getElementById('uiPot').textContent = pot;
        }

        // ================= SCOREBOARD & TEAMS =================
        function renderScoreboard() {
            const board = document.getElementById('uiScoreboard');
            board.innerHTML = '';
            board.style.setProperty("--team-count",teams.length);
            teams.forEach((t, idx) => {
                const isActive = (idx === activeTeamIndex) ? 'active-team-glow' : 'border-indigo-600 opacity-80';
                const bg = (idx === activeTeamIndex) ? 'bg-indigo-800' : 'bg-slate-900';
                
                board.innerHTML += `
                    <div onclick="setActiveTeam(${idx})" class="${bg} border-2 ${isActive} rounded-2xl p-4 min-w-[160px] text-center shadow-xl cursor-pointer transition-all hover:scale-105">
                        <div class="text-indigo-200 font-black text-xl truncate mb-1">${escapeHtml(t.name)}</div><div class="team-player">${escapeHtml(t.players[t.playerIndex])}</div>
                        <div id="scoreVal${idx}" class="text-4xl font-black text-yellow-400 drop-shadow-md">${t.score}</div>
                    </div>
                `;
            });
        }

        function setActiveTeam(idx) {
            if(activeTeamIndex!==idx)soundSwitch();
            activeTeamIndex = idx;
            renderScoreboard();
            updateActivePlayerUI();
        }

        function updateActivePlayerUI(){
            const select=document.getElementById('activePlayerSelect');if(!select||!teams.length)return;
            const team=teams[activeTeamIndex];
            select.innerHTML=team.players.map((p,i)=>`<option value="${i}" ${i===team.playerIndex?'selected':''}>${escapeHtml(p)}</option>`).join('');
        }
        function setActivePlayer(i){if(!teams.length)return;soundSwitch();teams[activeTeamIndex].playerIndex=i;renderScoreboard();updateActivePlayerUI();resetTimer();}
        function nextPlayer(){if(!teams.length)return;soundSwitch();const t=teams[activeTeamIndex];t.playerIndex=(t.playerIndex+1)%t.players.length;renderScoreboard();updateActivePlayerUI();resetTimer();}

        function awardPot() {
            if(pot === 0) return;
            soundCorrect();
            teams[activeTeamIndex].score += pot;
            
            // Anim
            const scoreEl = document.getElementById(`scoreVal${activeTeamIndex}`);
            scoreEl.classList.add('scale-150', 'text-white');
            setTimeout(() => scoreEl.classList.remove('scale-150', 'text-white'), 400);
            
            pot = 0;
            updatePotUI();
            renderScoreboard();
        }

        function awardOutsideAnswer() {
            soundCorrect();
            teams[activeTeamIndex].score += 5;
            const scoreEl = document.getElementById(`scoreVal${activeTeamIndex}`);
            scoreEl.classList.add('scale-150', 'text-green-400');
            setTimeout(() => scoreEl.classList.remove('scale-150', 'text-green-400'), 400);
            renderScoreboard();
        }

        // ================= NAVIGATION =================
        function navNext() {
            soundNavigate();
            if(currentQuestionIdx < 5) {
                currentQuestionIdx++;
            } else {
                currentQuestionIdx = 0;
                currentSectionIdx++;
            }
            if(currentSectionIdx>=gameData.length){currentSectionIdx=gameData.length-1;currentQuestionIdx=5;showFinal();return;}
            loadQuestion();
        }

        function navPrev() {
            soundNavigate();
            if(currentQuestionIdx > 0) {
                currentQuestionIdx--;
            } else if (currentSectionIdx > 0) {
                currentSectionIdx--;
                currentQuestionIdx = 5;
            }
            loadQuestion();
        }

        function showFinal(){
            resetTimer();
            const sorted=[...teams].sort((a,b)=>b.score-a.score);
            const winners=sorted.filter(t=>t.score===sorted[0].score).map(t=>t.name).join(' و ');
            document.getElementById('uiQuestion').textContent='🏆 انتهت المسابقة! الفائز: '+winners;
            document.getElementById('uiAnswersGrid').innerHTML='<div class="col-span-full text-center text-yellow-300 text-3xl font-black">مبروك للفائزين 🎉</div>';
            document.getElementById('uiCategory').textContent='النتائج النهائية';
        }
        // ================= TIMER =================
        function updateTimerUI() {
            const el = document.getElementById('uiTimer');
            el.textContent = currentTimer;
            if(currentTimer <= 5 && currentTimer > 0) {
                el.classList.add('timer-warning');
            } else {
                el.classList.remove('timer-warning');
            }
        }

        function toggleTimer() {
            soundSwitch();
            const btn = document.getElementById('btnTimerToggle');
            if(timerInterval) {
                // Pause
                clearInterval(timerInterval);
                timerInterval = null;
                btn.innerHTML = '▶️ استئناف';
                btn.classList.replace('bg-orange-600', 'bg-emerald-600');
            } else {
                // Start
                if(currentTimer === 0) currentTimer = timerAmount;
                btn.innerHTML = '⏸️ إيقاف';
                btn.classList.replace('bg-emerald-600', 'bg-orange-600');
                
                timerInterval = setInterval(() => {
                    currentTimer--;
                    if(currentTimer > 0 && currentTimer <= 3) soundTimerTick();
                    
                    if(currentTimer <= 0) {
                        clearInterval(timerInterval);
                        timerInterval = null;
                        soundTimerEnd();
                        btn.innerHTML = '▶️ مؤقت';
                        btn.classList.replace('bg-orange-600', 'bg-emerald-600');
                    }
                    updateTimerUI();
                }, 1000);
            }
        }

        function resetTimer() {
            if(timerInterval) clearInterval(timerInterval);
            timerInterval = null;
            currentTimer = timerAmount;
            const btn = document.getElementById('btnTimerToggle');
            btn.innerHTML = '▶️ مؤقت';
            if(btn.classList.contains('bg-orange-600')) btn.classList.replace('bg-orange-600', 'bg-emerald-600');
            updateTimerUI();
        }

        // Init Setup View
        window.addEventListener("DOMContentLoaded",generateTeamInputs);
    </script>
</body>
</html>
